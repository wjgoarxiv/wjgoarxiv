name: Refresh profile

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch live profile data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_live.py
      - name: Render hero, badges and contribution lattice
        run: |
          python scripts/render_hero.py
          python scripts/render_badges.py
          python scripts/render_contrib.py
      - name: Commit profile assets if they changed
        run: |
          git add assets/hero-night.svg assets/hero-day.svg assets/badges assets/contrib-night.svg assets/contrib-day.svg data/live.json data/contrib.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile assets"
          git push
